[package]
name = "varda"
version = "0.7.0"
edition = "2024"
authors = ["Varda Contributors"]
description = "Linux, MacOS, and Windows VJ software"
license = "MIT"

[lib]
name = "varda"
path = "src/lib.rs"

# `clippy::pedantic` warns on every target, and CI runs clippy with `-D warnings`.
# Each allowed lint below states its reason; a new one needs the same. See
# CONTRIBUTING.md § Lints.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Pixel, sample and vertex math casts between integers and floats everywhere;
# `try_from` would add error handling to the render loop.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

# Fires on hundreds of snapshot accessors and catches no bugs.
must_use_candidate = "allow"

# About 130 functions are over 100 lines; they are split as they are worked on.
too_many_lines = "allow"

[dependencies]
# Graphics
wgpu = "30.0"
winit = "0.30"
bytemuck = { version = "1.25", features = ["derive"] }
half = "2.6"

# Shader compilation. Built from source so shaderc links statically and a
# Homebrew libshaderc_shared.dylib can't be picked up at runtime.
shaderc = { version = "0.10", features = ["build-from-source"] }
# `hlsl-out` lets tests run DX12's shader translation on any platform.
naga = { version = "30.0", features = ["spv-in", "wgsl-out", "hlsl-out"] }

# ISF metadata parsing
serde = { version = "1.0", features = ["derive", "rc"] }
# `preserve_order` keeps provider config fields in written order in saved files
# and the API. Set here because otherwise only servo (with `html`) enables it.
serde_json = { version = "1.0", features = ["preserve_order"] }

# UI
egui = "0.36"
# egui's bundled fonts (already built through egui): the text deck's fallback
# on a machine with no system fonts.
epaint_default_fonts = "0.36"
egui-wgpu = "0.36"
egui-winit = { version = "0.36", features = ["accesskit"] }

# File system
notify = "8.2"
walkdir = "2.5"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
env_logger = "0.11"
log = "0.4"

# Async runtime
pollster = "0.4"
cpal = "0.17.3"
rustfft = "6.4.1"
crossbeam-channel = "0.5.15"
# Default features off: Varda uses neither libavdevice nor libavfilter, and they
# pull in dozens of host libraries (SDL2, JACK, OpenAL, Flite). `format` is needed
# for every stream protocol.
ffmpeg-next = { version = "9.0.0", default-features = false, features = [
    "codec",
    "format",
    "software-resampling",
    "software-scaling",
] }
rosc = "0.11.4"
image = "0.25.10"
rfd = "0.17.2"
snap = "1.1.1"
nokhwa = { version = "0.10.10", features = ["input-native", "output-threaded"] }
midir = "0.11"
yuvutils-rs = "0.8.3"
geo = "0.33.1"
sysinfo = "0.38.4"
# `time` is needed by the Linux screen-cast portal: zbus sets timeouts on this
# runtime, which panic at runtime without the time driver.
tokio = { version = "1.52.2", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.6.10", features = ["cors", "fs"] }
futures-util = "0.3.32"
libloading = "0.9.0"
futures-lite = "2.6.1"
uuid = { version = "1.23.1", features = ["v4"] }
json-patch = "4.2.0"
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.5.2"
imageproc = "0.26.2"
# SVG parsing (stage plan import, SVG decks, text deck shaping) and rasterizing.
# Kept on the same minor so both share a tree type; default features keep text
# and embedded rasters.
usvg = "0.47.0"
resvg = "0.47.0"
dxf = "0.6.1"
base64 = "0.22.1"
dirs = "6.0.0"
arc-swap = "1.9.1"
# ONNX Runtime links statically through ort's default `download-binaries`
# feature (CPU build), so there is no dylib to ship.
ort = { version = "2.0.0-rc.12", optional = true }
ndarray = { version = "0.17.2", optional = true }
servo = { version = "0.1.0", optional = true }
url = { version = "2.5", optional = true }
euclid = { version = "0.22", optional = true }
keyboard-types = { version = "0.8", optional = true }
# Kinect v1 through libfreenect, behind the default-on `depth` feature. Build
# with `--no-default-features` where libfreenect isn't installed.
freenectrs = { version = "0.1.0", optional = true }
# Test scratch workspaces (src/testing.rs). Listed here too so the helper is
# available to integration tests through the `test-fixtures` feature.
tempfile = { version = "3.27.0", optional = true }
dashu-float = "0.6.0"

# Syphon (macOS). Syphon.framework is loaded at runtime with libloading, so
# these crates are its only build-time dependencies.
[target.'cfg(target_os = "macos")'.dependencies]
objc2            = "0.6"
objc2-foundation = "0.3"
# `objc2-io-surface` provides the IOSurface texture calls zero-copy Syphon
# receive uses. Named here because Syphon builds with `--no-default-features`,
# where the crates that would otherwise enable it are absent.
objc2-metal      = { version = "0.3", features = ["objc2-io-surface"] }
objc2-io-surface = "0.3"
# EDR headroom is read from NSScreen. Already in the tree through winit.
objc2-app-kit    = "0.3"

# ScreenCaptureKit for macOS screen and window capture. Same objc2 family and
# versions as above, so no duplicate tree.
objc2-screen-capture-kit = { version = "0.3", optional = true }
objc2-core-media         = { version = "0.3", optional = true }
objc2-core-video         = { version = "0.3", optional = true }
objc2-core-graphics      = { version = "0.3", optional = true }
objc2-core-foundation    = { version = "0.3", optional = true }
dispatch2                = { version = "0.3", optional = true }
block2                   = { version = "0.6", optional = true }

# Windows: Windows Graphics Capture (screen and window capture) and D3D for Spout.
[target.'cfg(target_os = "windows")'.dependencies]
# Static DXC, so DX12 never falls back to FXC when `dxcompiler.dll` is missing.
# FXC unrolls loops aggressively and fails on large shaders such as
# `oscilloscope.fs`. Static, so there is no DLL to ship.
wgpu = { version = "30.0", features = ["static-dxc"] }
# Not optional: screen capture and Spout both use it, and Spout is not behind the
# screen-capture feature. Direct3D12, Direct3D11on12 and Memory are Spout's.
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D11on12",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux screen and window capture: XDG portal + PipeWire under Wayland, X11
# otherwise, chosen at runtime so one package serves both sessions.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", optional = true, features = ["randr"] }
# Only the `screencast` portal; the other portals stay out.
ashpd = { version = "0.13", optional = true, default-features = false, features = ["tokio", "screencast"] }
pipewire = { version = "0.10", optional = true }

[features]
default = ["face-detection", "html", "depth", "screen-capture"]
# ML analyzers (ONNX Runtime + ndarray). Off for the x86_64 macOS build.
face-detection = ["dep:ort", "dep:ndarray"]
# HTML decks through Servo, rendered in software and read back to the CPU. Only
# the Servo backend is gated; the rest of the HTML integration always compiles.
html = ["dep:servo", "dep:url", "dep:euclid", "dep:keyboard-types"]
# Kinect v1 depth input. Only the libfreenect backend is gated; without it the
# depth integration compiles against a mock backend.
depth = ["dep:freenectrs"]
# Screen and window capture. Only the platform backends are gated; without them
# the integration compiles against a mock backend. The `dep:` entries are
# target-scoped, so each platform pulls only its own bindings.
screen-capture = ["dep:objc2-screen-capture-kit", "dep:objc2-core-media", "dep:objc2-core-video", "dep:objc2-core-graphics", "dep:objc2-core-foundation", "dep:dispatch2", "dep:block2", "dep:x11rb", "dep:ashpd", "dep:pipewire"]
test-fixtures = ["dep:tempfile"]
url = ["dep:url"]
euclid = ["dep:euclid"]
keyboard-types = ["dep:keyboard-types"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# So `tests/gpu_context_stress.rs` can call midir directly, without
# `MidiDeviceManager`'s lock. Same version as the normal dependency.
midir = "0.11"
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
proptest = "1.9"
# `default-features = false` keeps `cargo test --no-default-features` from
# re-enabling the defaults (and linking libfreenect) through this
# self-dependency. A plain `cargo test` still gets the defaults.
varda = { path = ".", default-features = false, features = ["test-fixtures"] }

