[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# Required: catch_unwind isolates panics from bad media files, imageproc and
# background threads. With "abort", any panic ends the show.
panic = "unwind"

[profile.bench]
# Fast bench builds. For profiling, add symbols with `CARGO_PROFILE_BENCH_DEBUG=1`.
debug = false
strip = "symbols"
lto = false
codegen-units = 16

[profile.bench.package.dashu-float]
opt-level = 3

[profile.bench.package.dashu-int]
opt-level = 3

[profile.bench.package.dashu-base]
opt-level = 3

# The deep-zoom bignum math is unusably slow unoptimized; optimize only these
# crates so Varda itself stays debuggable.
[profile.dev.package.dashu-float]
opt-level = 3

[profile.dev.package.dashu-int]
opt-level = 3

[profile.dev.package.dashu-base]
opt-level = 3
