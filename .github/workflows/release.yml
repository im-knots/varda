name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Verify tag is on main
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check tag commit is on main
        run: |
          TAG_SHA=$(git rev-parse HEAD)
          if ! git branch -r --contains "$TAG_SHA" | grep -q 'origin/main'; then
            echo "::error::Tag does not point to a commit on main. Aborting release."
            exit 1
          fi

      # The artifacts take their version from the tag, but the binary reports
      # CARGO_PKG_VERSION. Nothing downstream compares them, so without this a release
      # can ship a package called 0.7.0 containing a binary that says 0.6.0.
      #
      # Cargo.lock records varda's own version too, and the Arch PKGBUILD builds
      # --frozen. A stale lockfile fails that build with "cannot update the lock file",
      # ~30 minutes into the matrix. Catching it here costs seconds.
      - name: Check tag, Cargo.toml and Cargo.lock agree
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          TAG_VERSION="${TAG#v}"
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          LOCK_VERSION="$(grep -A1 '^name = "varda"$' Cargo.lock | grep '^version' | cut -d'"' -f2)"

          echo "tag        : $TAG ($TAG_VERSION)"
          echo "Cargo.toml : $CARGO_VERSION"
          echo "Cargo.lock : $LOCK_VERSION"

          fail=0
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $CARGO_VERSION."
            echo "::error::The packages would be named $TAG_VERSION and contain a binary reporting $CARGO_VERSION."
            fail=1
          fi
          if [ "$LOCK_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Cargo.lock has varda $LOCK_VERSION but Cargo.toml has $CARGO_VERSION."
            echo "::error::Run 'cargo check --offline' and commit Cargo.lock: the Arch build uses --frozen and will fail without it."
            fail=1
          fi
          [ "$fail" -eq 0 ]

  artifacts:
    name: Artifacts
    needs: [preflight]
    # The build and smoke matrices live in a reusable workflow so release-dryrun.yml can
    # run the identical graph on a pull request. Editing the pipeline in one place keeps
    # the dry run honest.
    uses: ./.github/workflows/build-artifacts.yml
    with:
      version: ${{ github.ref_name }}
      source-ref: ${{ github.ref_name }}

  release:
    name: Create GitHub Release
    # A tarball that cannot start on a supported distribution is not published.
    # `artifacts` succeeds only if every build AND every smoke row inside it passed, so
    # nothing ships on a build succeeding alone.
    needs: [artifacts]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      # Provenance attestation
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            linux-*/*
            macos-dmg/Varda-macOS-universal.dmg
            windows-zip/Varda-Windows-x64.zip

      - name: Determine tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Varda ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            linux-*/*
            macos-dmg/Varda-macOS-universal.dmg
            windows-zip/Varda-Windows-x64.zip
