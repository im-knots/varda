name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Verify tag is on main
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check tag commit is on main
        run: |
          TAG_SHA=$(git rev-parse HEAD)
          if ! git branch -r --contains "$TAG_SHA" | grep -q 'origin/main'; then
            echo "::error::Tag does not point to a commit on main. Aborting release."
            exit 1
          fi

  artifacts:
    name: Artifacts
    needs: [preflight]
    # The build and smoke matrices live in a reusable workflow so release-dryrun.yml can
    # run the identical graph on a pull request. Editing the pipeline in one place keeps
    # the dry run honest.
    uses: ./.github/workflows/build-artifacts.yml
    with:
      version: ${{ github.ref_name }}
      source-ref: ${{ github.ref_name }}

  release:
    name: Create GitHub Release
    # A tarball that cannot start on a supported distribution is not published.
    # `artifacts` succeeds only if every build AND every smoke row inside it passed, so
    # nothing ships on a build succeeding alone.
    needs: [artifacts]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      # Provenance attestation
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            linux-*/*
            macos-dmg/Varda-macOS-universal.dmg
            windows-zip/Varda-Windows-x64.zip

      - name: Determine tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Varda ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            linux-*/*
            macos-dmg/Varda-macOS-universal.dmg
            windows-zip/Varda-Windows-x64.zip
