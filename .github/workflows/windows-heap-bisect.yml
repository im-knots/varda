name: windows heap bisect

# A diagnostic, not a gate. This job is *expected* to fail: it exists to
# reproduce a crash.
#
# The Windows lib suite dies within seconds of starting under the default test
# parallelism. `--test-threads=1` in test.yml hides it rather than fixing it.
# Heap corruption is reported when some later allocation notices the damage, so
# the reported stack is innocent and the log names nothing useful.
#
# ROUND 1 asked whether Phase 58's Spout code was responsible. `spout only`
# passed twenty consecutive parallel runs; `without spout` crashed on attempt
# one. The fault is **pre-existing**, which means it shipped in v0.4.0 and
# v0.5.0.
#
# ROUND 2 split the suite by area: `internal::renderer` against everything else.
# **Both cells crashed**, with different exception codes:
#   renderer only : STATUS_ACCESS_VIOLATION (0xc0000005) after ~21 tests
#   no renderer   : STATUS_HEAP_CORRUPTION  (0xc0000374) after ~8 tests
# Both within seconds of start, and every test that had *printed* by then was a
# pure CPU test. So the crash is not in the tests that were finishing; it is in
# whatever the other threads had concurrently started.
#
# That rules out "one bad module" and points at something both halves do a lot
# of. Both halves build GPU contexts: about sixty test sites call
# `GpuContext::new_headless`, spread across nearly every module, and each builds
# its own `wgpu::Instance` with `Backends::all()`, enumerates adapters, and
# creates a device. On the runner that device is WARP, a *software* D3D12
# implementation, and `Backends::all()` on Windows also brings up the Vulkan
# loader and a WGL context.
#
# ROUND 3 tried to reproduce instead of bisecting. `tests/gpu_context_stress.rs`
# built GPU contexts on four threads at once, with the backend set and setup
# stage under environment control. **All four cells were green**, including the
# production `new_headless` path. So concurrent context creation is not it.
#
# That is a useful negative, because of *how* the reproducer differed from the
# suite: it built contexts and dropped them. It never compiled a shader.
#
# ROUND 4, below, closes that gap. On DX12 `create_render_pipeline` is where
# naga emits HLSL and wgpu-hal calls `D3DCompile` in `d3dcompiler_47.dll`, and
# wgpu-hal holds no lock around that call (see wgpu-hal 30.0.0
# `src/dx12/shader_compilation.rs`). Every `Instance` loads the library
# separately, but Windows reference counts modules, so all of them are calling
# into one copy of FXC with one set of globals. FXC is the compiler in play
# here: `Dx12Compiler::Auto` looks for `dxcompiler.dll` and falls back to FXC,
# and the runner is unlikely to have DXC on PATH (the step below reports
# whether it does, so this is checked rather than assumed).
#
#   pipelines parallel : context + shader compile on four threads. The
#                        hypothesis. A crash here ends the search.
#   pipelines serial   : the control. Same total compiles, one thread.
#   parallel, locked   : identical to the first, with a process-global mutex
#                        around `create_render_pipeline` and nothing else
#                        changed. Green here against a crash there is proof,
#                        and shows the shape of a fix.
#   parallel, DXC      : forces `dxcompiler.dll` instead of FXC. Green here
#                        names FXC directly. Note this cannot be done with
#                        `WGPU_DX12_COMPILER`: that is only read by
#                        `BackendOptions::from_env_or_default`, and
#                        `new_headless` calls `BackendOptions::default`, so
#                        Varda ignores it. The test selects the compiler itself.
#
# Neither explicit compiler setting falls back if it will not load, so the DXC
# cell fails loudly rather than quietly re-testing FXC.
#
# If every cell is clean again, the hypothesis is wrong and the next lever is
# Full Page Heap (`gflags /p /enable <exe> /full`) plus `LocalDumps` and
# `cdb -c "!analyze -v"`, or `-Zsanitizer=address` on nightly, which reports the
# bad access and its allocation without a debugger. See spec/roadmap.md.

# TEMPORARY: runs as a PR check so it can be triggered from this branch.
#
# `workflow_dispatch` renders a Run button only for workflows already on the
# default branch, and `gh workflow run` fails for the same reason, so a manual
# trigger is not available until this lands on main.
#
# **Remove the `pull_request` trigger before merging.** Leaving a job that is
# meant to fail on every PR trains people to ignore a red X. Once on main, the
# Run button appears and its "Use workflow from" dropdown can target any branch.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bisect:
    name: heap bisect (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pipelines parallel
            threads: 4
            iters: 8
            lock: ""
            compiler: ""
          - name: pipelines serial
            threads: 1
            iters: 32
            lock: ""
            compiler: ""
          - name: pipelines parallel, compile locked
            threads: 4
            iters: 8
            lock: "1"
            compiler: ""
          - name: pipelines parallel, DXC
            threads: 4
            iters: 8
            lock: ""
            compiler: "dxc"
    env:
      # Same memory settings as test.yml: the runner has a small paging file and
      # full debug info made rustc fail to mmap its own rlibs.
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Build setup mirrors test.yml's `test (windows)`. Same vcpkg cache key, so
      # this reuses that job's cache rather than paying for its own.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-x64-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: vcpkg-windows-x64-

      - name: Install vcpkg FFmpeg
        shell: pwsh
        run: |
          vcpkg install ffmpeg:x64-windows
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Install LLVM (for shaderc)
        run: choco install llvm -y
        shell: cmd

      - name: Set build environment
        shell: pwsh
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Report the adapter before stressing it, so a runner whose adapter changed
      # is visible in the log rather than inferred from a different crash. Same
      # feature set as the Run step below on purpose, so both share one build.
      - name: Report adapter
        run: cargo test --no-default-features --lib spout::capability -- --nocapture

      # Which compiler `Dx12Compiler::Auto` will pick is the premise of this
      # whole round, so measure it rather than assuming. If DXC turns out to be
      # on PATH already then FXC was never in play and the hypothesis is dead
      # before the cells run.
      - name: Is DXC on PATH
        shell: pwsh
        continue-on-error: true
        run: |
          $found = Get-Command dxcompiler.dll -ErrorAction SilentlyContinue
          if ($found) { Write-Host "dxcompiler.dll found: $($found.Source)" }
          else { Write-Host "dxcompiler.dll NOT on PATH, so Auto falls back to FXC" }
          Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter dxcompiler.dll -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 5 -ExpandProperty FullName

      # The DXC cell needs the library importable. The Windows SDK ships it, so
      # put its bin directory on PATH. If it is genuinely absent the cell fails
      # rather than silently re-running FXC, because an explicit compiler choice
      # does not fall back.
      - name: Put DXC on PATH
        if: matrix.compiler == 'dxc'
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter dxcompiler.dll -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $dll) { Write-Host "::error::no dxcompiler.dll in the Windows SDK"; exit 1 }
          Write-Host "using $($dll.FullName)"
          echo $dll.DirectoryName >> $env:GITHUB_PATH

      # Minimal features on purpose. The reproducer needs only the renderer, and
      # every feature left out is one fewer confound (and a much shorter build).
      # If every cell here is clean, re-run with the suite's own
      # `face-detection,screen-capture` before concluding the hypothesis is dead.
      #
      # `--test-threads=1` is about the harness, not the subject: it keeps the
      # reproducers from overlapping each other. The parallelism under test is
      # inside the test, set by VARDA_STRESS_THREADS.
      - name: Run
        shell: pwsh
        env:
          VARDA_STRESS_THREADS: ${{ matrix.threads }}
          VARDA_STRESS_ITERS: ${{ matrix.iters }}
          VARDA_STRESS_LOCK_COMPILE: ${{ matrix.lock }}
          VARDA_STRESS_COMPILER: ${{ matrix.compiler }}
        run: |
          # An empty env var is still *set* on Windows, and the test only checks
          # presence, so clear the ones this cell does not want.
          if (-not "${{ matrix.lock }}") { Remove-Item Env:VARDA_STRESS_LOCK_COMPILE -ErrorAction SilentlyContinue }
          if (-not "${{ matrix.compiler }}") { Remove-Item Env:VARDA_STRESS_COMPILER -ErrorAction SilentlyContinue }
          $failed = 0
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "--- attempt $i of 3 ---"
            cargo test --no-default-features --test gpu_context_stress `
              -- --ignored --nocapture --test-threads=1 parallel_pipelines
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::crashed or failed on attempt $i (exit $LASTEXITCODE)"
              $failed = 1
              break
            }
          }
          # A single crash is the finding; report it as a failure so the matrix
          # cell is unambiguous at a glance.
          exit $failed
