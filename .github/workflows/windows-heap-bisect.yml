name: windows heap bisect

# A diagnostic, not a gate. This job is *expected* to fail: it exists to
# reproduce a crash.
#
# The Windows lib suite dies within seconds of starting under the default test
# parallelism. `--test-threads=1` in test.yml hides it rather than fixing it.
# Heap corruption is reported when some later allocation notices the damage, so
# the reported stack is innocent and the log names nothing useful.
#
# ROUND 1 asked whether Phase 58's Spout code was responsible. `spout only`
# passed twenty consecutive parallel runs; `without spout` crashed on attempt
# one. The fault is **pre-existing**, which means it shipped in v0.4.0 and
# v0.5.0.
#
# ROUND 2 split the suite by area: `internal::renderer` against everything else.
# **Both cells crashed**, with different exception codes:
#   renderer only : STATUS_ACCESS_VIOLATION (0xc0000005) after ~21 tests
#   no renderer   : STATUS_HEAP_CORRUPTION  (0xc0000374) after ~8 tests
# Both within seconds of start, and every test that had *printed* by then was a
# pure CPU test. So the crash is not in the tests that were finishing; it is in
# whatever the other threads had concurrently started.
#
# That rules out "one bad module" and points at something both halves do a lot
# of. Both halves build GPU contexts: about sixty test sites call
# `GpuContext::new_headless`, spread across nearly every module, and each builds
# its own `wgpu::Instance` with `Backends::all()`, enumerates adapters, and
# creates a device. On the runner that device is WARP, a *software* D3D12
# implementation, and `Backends::all()` on Windows also brings up the Vulkan
# loader and a WGL context.
#
# ROUND 3 tried to reproduce instead of bisecting: `tests/gpu_context_stress.rs`
# built GPU contexts on four threads at once, with the backend set and setup
# stage under environment control. **All four cells green.** Concurrent context
# creation is not it.
#
# ROUND 4 added the thing Round 3 had left out, shader compilation: parallel
# `create_render_pipeline`, a serial control, a process-global mutex around
# pipeline creation, and a run forced onto DXC instead of FXC. **All four cells
# green.** Concurrent FXC is not it either.
#
# THREE HYPOTHESES, THREE WRONG ANSWERS. Each fit the evidence when proposed.
# That is the signal to stop guessing where the corruption is and use tooling
# that reports where it is.
#
# One thing the earlier rounds did establish, and it makes this affordable: the
# crash lands **within seconds**, after roughly eight completed tests.
# Instrumentation that would be ruinous across a 2586-test run is cheap across
# one that dies almost immediately.
#
# ROUND 5 never ran: every cell died installing `cdb`, via an SDK fwlink that
# was a guess and returned an HTML page.
#
# ROUND 6 dropped the debugger and asked the harness instead. libtest prints a
# test when it *finishes*, which is why five rounds had been reading the names of
# tests that survived. Its JSON format also emits an event when a test *starts*,
# so started-minus-finished is exactly what was in flight when the process died.
#
# **IT WORKED.** The two thread cell died with STATUS_HEAP_CORRUPTION five tests
# into a 2590 test run and named the two that were executing:
#
#   app::commands::tests::a_timecode_patch_over_the_bus_leaves_the_undo_stack_alone
#   app::commands::tests::choosing_a_timecode_signal_reaches_the_reader
#
# Timecode is a red herring; each only sets a preference in memory. What they
# share is their fixture: both call `headless_app()`, which is
# `GpuContext::new_headless()` then `VardaApp::new`. Round 3 already cleared the
# GPU half, so the suspect is **two concurrent `VardaApp::new` calls**: audio
# (cpal into WASAPI, so COM), OSC, the shader registry, and the rest of startup.
#
# ROUND 6's remaining cells corroborated it exactly. At eight threads, eight
# tests were in flight and **all eight build an app**; at four with page heap,
# four, likewise. Across three cells that is fourteen of fourteen, while every
# test that *finished* builds no app. The page heap cell also died with
# ACCESS_VIOLATION rather than HEAP_CORRUPTION, which is page heap working as
# intended: the corrupting write happens during app construction rather than
# merely being noticed there.
#
# ROUND 7, below, says which part, using
# `parallel_app_construction` in `tests/gpu_context_stress.rs`.
# `VARDA_STRESS_APP_STAGE` chooses how far into startup to go:
#
#   app       : the whole fixture, to confirm the reproducer reproduces at all.
#   camera    : `CameraManager::new`. Not feature gated, so it runs in every
#               build. nokhwa on Windows is Media Foundation: COM, plus an
#               `MFStartup` refcount shared across the process.
#   screencap : `ScreenCaptureManager::new`. Windows Graphics Capture, which
#               calls `CoIncrementMTAUsage` to pin the process into the MTA.
#   audio     : `AudioManager::new`, which enumerates devices. cpal into WASAPI,
#               which is COM again.
#   midi      : `MidiDeviceManager::new`, which enumerates ports.
#   gpu       : the control. Round 3 cleared it, so a crash here would mean
#               something about this job differs from that one.
#
# The three COM cells are the point. Three unrelated subsystems each put this
# process into a COM apartment during startup, none of them coordinating with
# the others, and mixing apartment models is a classic source of exactly this.
#
# This is a confirmation step, not another hypothesis. The names came from
# measurement rather than from reasoning about which subsystem looked risky,
# which is what the previous five rounds did, unsuccessfully.
#
# Round 6's other cells matter for how this one is sized. Two threads crashed,
# **four threads passed all three attempts**, eight threads crashed, and four
# threads with page heap crashed. Four passing is not a threshold, it is a race
# whose window three runs happened to miss: if the per run crash chance were
# even one in two, surviving three runs has probability 0.125.
#
# The consequence is that **a green cell proves very little**, here or when
# validating a fix. So this round runs many more constructions than the suite
# ever does, and repeats more times.

# TEMPORARY: runs as a PR check so it can be triggered from this branch.
#
# `workflow_dispatch` renders a Run button only for workflows already on the
# default branch, and `gh workflow run` fails for the same reason, so a manual
# trigger is not available until this lands on main.
#
# **Remove the `pull_request` trigger before merging.** Leaving a job that is
# meant to fail on every PR trains people to ignore a red X. Once on main, the
# Run button appears and its "Use workflow from" dropdown can target any branch.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bisect:
    name: heap bisect (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app (the fixture that crashed)
            stage: app
            threads: "4"
          - name: camera (Media Foundation)
            stage: camera
            threads: "4"
          - name: screencap (WGC, CoIncrementMTAUsage)
            stage: screencap
            threads: "4"
          - name: audio (WASAPI)
            stage: audio
            threads: "4"
          - name: midi
            stage: midi
            threads: "4"
          - name: gpu (control, cleared in round 3)
            stage: gpu
            threads: "4"
    env:
      # Same memory settings as test.yml: the runner has a small paging file and
      # full debug info made rustc fail to mmap its own rlibs.
      #
      # `line-tables-only` rather than test.yml's `0`, so any symbol that does
      # get printed points at the right file.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Build setup mirrors test.yml's `test (windows)`. Same vcpkg cache key, so
      # this reuses that job's cache rather than paying for its own.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-x64-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: vcpkg-windows-x64-

      - name: Install vcpkg FFmpeg
        shell: pwsh
        run: |
          vcpkg install ffmpeg:x64-windows
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Install LLVM (for shaderc)
        run: choco install llvm -y
        shell: cmd

      - name: Set build environment
        shell: pwsh
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Built separately from the run so RUSTC_BOOTSTRAP stays out of the build
      # fingerprint. Setting it here would evict the cargo cache every time.
      # Same features as `test (windows)`, which is where the crash was seen.
      # `face-detection` in particular pulls ONNX Runtime into the process, and
      # `VardaApp::new` is the thing under test, so a narrower feature set could
      # come back green without meaning anything.
      - name: Build test binary
        run: cargo test --features face-detection,screen-capture --no-default-features --test gpu_context_stress --no-run

      - name: Run
        shell: pwsh
        env:
          VARDA_SKIP_GOLDEN_SNAPSHOTS: 1
          VARDA_STRESS_APP_STAGE: ${{ matrix.stage }}
          VARDA_STRESS_THREADS: ${{ matrix.threads }}
          # Sized against measurement, not a guess. Locally one construction
          # takes ~0.8s at four threads, so 64 iterations is ~256 constructions
          # in ~3.5 minutes, and five attempts is ~17 minutes inside a 60 minute
          # timeout. A full suite run takes ~4 minutes and makes far fewer
          # concurrent constructions, so this is roughly seven times the
          # exposure per minute.
          VARDA_STRESS_ITERS: "64"
        run: |
          $names = @{
            "-1073741819" = "0xC0000005 STATUS_ACCESS_VIOLATION";
            "-1073741571" = "0xC00000FD STATUS_STACK_OVERFLOW";
            "-1073740940" = "0xC0000374 STATUS_HEAP_CORRUPTION";
            "-1073741515" = "0xC0000135 STATUS_DLL_NOT_FOUND (the binary did not start; not the bug)";
          }

          $failed = 0
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "--- attempt $attempt of 5 ---"
            cargo test --no-default-features --features face-detection,screen-capture --test gpu_context_stress `
              -- --ignored --nocapture --test-threads=1 parallel_app_construction
            $code = $LASTEXITCODE
            if ($code -eq 0) { continue }

            $named = $names["$code"]
            if (-not $named) { $named = "unrecognized" }
            Write-Host "::error::attempt $attempt died with exit $code ($named)"
            $failed = 1
            break
          }
          exit $failed
