name: windows heap bisect

# A diagnostic, not a gate. This job is *expected* to fail: it exists to
# reproduce a crash.
#
# The Windows lib suite dies within seconds of starting under the default test
# parallelism. `--test-threads=1` in test.yml hides it rather than fixing it.
# Heap corruption is reported when some later allocation notices the damage, so
# the reported stack is innocent and the log names nothing useful.
#
# ROUND 1 asked whether Phase 58's Spout code was responsible. `spout only`
# passed twenty consecutive parallel runs; `without spout` crashed on attempt
# one. The fault is **pre-existing**, which means it shipped in v0.4.0 and
# v0.5.0.
#
# ROUND 2 split the suite by area: `internal::renderer` against everything else.
# **Both cells crashed**, with different exception codes:
#   renderer only : STATUS_ACCESS_VIOLATION (0xc0000005) after ~21 tests
#   no renderer   : STATUS_HEAP_CORRUPTION  (0xc0000374) after ~8 tests
# Both within seconds of start, and every test that had *printed* by then was a
# pure CPU test. So the crash is not in the tests that were finishing; it is in
# whatever the other threads had concurrently started.
#
# That rules out "one bad module" and points at something both halves do a lot
# of. Both halves build GPU contexts: about sixty test sites call
# `GpuContext::new_headless`, spread across nearly every module, and each builds
# its own `wgpu::Instance` with `Backends::all()`, enumerates adapters, and
# creates a device. On the runner that device is WARP, a *software* D3D12
# implementation, and `Backends::all()` on Windows also brings up the Vulkan
# loader and a WGL context.
#
# ROUND 3 tried to reproduce instead of bisecting: `tests/gpu_context_stress.rs`
# built GPU contexts on four threads at once, with the backend set and setup
# stage under environment control. **All four cells green.** Concurrent context
# creation is not it.
#
# ROUND 4 added the thing Round 3 had left out, shader compilation: parallel
# `create_render_pipeline`, a serial control, a process-global mutex around
# pipeline creation, and a run forced onto DXC instead of FXC. **All four cells
# green.** Concurrent FXC is not it either.
#
# THREE HYPOTHESES, THREE WRONG ANSWERS. Each fit the evidence when proposed.
# That is the signal to stop guessing where the corruption is and use tooling
# that reports where it is.
#
# One thing the earlier rounds did establish, and it makes this affordable: the
# crash lands **within seconds**, after roughly eight completed tests.
# Instrumentation that would be ruinous across a 2586-test run is cheap across
# one that dies almost immediately.
#
# ROUND 5 tried to run the binary under `cdb`. **The install step failed on
# every cell**: `cdb` is not on the runner image (actions/runner-images#942 asks
# for it), and the SDK fwlink used to fetch it was a guess that returned an HTML
# page, which then would not execute. Nothing was learned about the crash.
#
# ROUND 6 drops the debugger entirely, because the harness can answer the
# question by itself.
#
# The reason every round so far has been reading tea leaves is that **the last
# test printed is not the test that crashed**: libtest's normal output prints a
# test when it *finishes*, so the crashing test, still running, never appears.
#
# But libtest's JSON format also emits an event when a test **starts**:
#
#   { "type": "test", "event": "started", "name": "..." }
#   { "type": "test", "name": "...", "event": "ok" }
#
# So the tests that started and never reported a result are exactly the ones in
# flight when the process died. At four threads that is at most four names, out
# of 2586. Verified locally: the events stream as tests run rather than being
# batched at the end, and Rust line buffers stdout even through a pipe (checked
# with a program that prints and then calls `abort`), so everything up to the
# fault survives the crash.
#
# `--format=json` needs `-Zunstable-options`, hence `RUSTC_BOOTSTRAP=1`. It is
# set **only for the run**, never for the build: it is part of the build
# fingerprint, so setting it during compilation would evict the whole cache. And
# keeping the stable compiler matters on its own, because a nightly toolchain
# would be a different binary that might not crash.
#
#   four threads  : the configuration that has been crashing.
#   two threads   : fewer tests in flight, so a sharper answer, if it still dies.
#   eight threads : more pressure. Likely to crash sooner, and a wider in-flight
#                   set is still a small set.
#   page heap     : full page heap makes the *corrupting write* fault where it
#                   happens rather than when a later, innocent allocation
#                   notices. No debugger needed for that to help: it moves the
#                   crash closer to the culprit, so the in-flight list gets more
#                   informative. Enabled through the Image File Execution
#                   Options registry key, which needs no tooling.
#
# If this names a small set, the next step is to run just those tests together.

# TEMPORARY: runs as a PR check so it can be triggered from this branch.
#
# `workflow_dispatch` renders a Run button only for workflows already on the
# default branch, and `gh workflow run` fails for the same reason, so a manual
# trigger is not available until this lands on main.
#
# **Remove the `pull_request` trigger before merging.** Leaving a job that is
# meant to fail on every PR trains people to ignore a red X. Once on main, the
# Run button appears and its "Use workflow from" dropdown can target any branch.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bisect:
    name: heap bisect (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: four threads
            threads: "4"
            pageheap: "0"
          - name: two threads
            threads: "2"
            pageheap: "0"
          - name: eight threads
            threads: "8"
            pageheap: "0"
          - name: four threads + page heap
            threads: "4"
            pageheap: "1"
    env:
      # Same memory settings as test.yml: the runner has a small paging file and
      # full debug info made rustc fail to mmap its own rlibs.
      #
      # `line-tables-only` rather than test.yml's `0`. A debugging round needs
      # symbols that point at the right file, and this is the cheapest setting
      # that gives them.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Build setup mirrors test.yml's `test (windows)`. Same vcpkg cache key, so
      # this reuses that job's cache rather than paying for its own.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-x64-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: vcpkg-windows-x64-

      - name: Install vcpkg FFmpeg
        shell: pwsh
        run: |
          vcpkg install ffmpeg:x64-windows
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Install LLVM (for shaderc)
        run: choco install llvm -y
        shell: cmd

      - name: Set build environment
        shell: pwsh
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Built separately from the run so RUSTC_BOOTSTRAP stays out of the build
      # fingerprint. Setting it here would evict the cargo cache every time.
      - name: Build test binary
        run: cargo test --no-default-features --features face-detection,screen-capture --lib --no-run

      - name: Enable full page heap
        if: matrix.pageheap == '1'
        shell: pwsh
        run: |
          # Image File Execution Options is keyed on file name, and cargo stamps
          # a hash into it, so resolve the name rather than hardcoding it.
          $exe = Get-ChildItem target\debug\deps\varda-*.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Write-Host "enabling page heap for $($exe.Name)"
          $key = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\$($exe.Name)"
          New-Item -Path $key -Force | Out-Null
          # FLG_HEAP_PAGE_ALLOCS, then full page heap (0x3) rather than light
          # (0x1): full faults on the bad write, light only notices at free.
          New-ItemProperty -Path $key -Name GlobalFlag -Value 0x02000000 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name PageHeapFlags -Value 0x3 -PropertyType DWord -Force | Out-Null

      - name: Run and report what was in flight
        shell: pwsh
        env:
          VARDA_SKIP_GOLDEN_SNAPSHOTS: 1
          VARDA_REQUIRE_GPU: 1
          # Runtime only. See the note at the top of this file.
          RUSTC_BOOTSTRAP: "1"
        run: |
          $exe = Get-ChildItem target\debug\deps\varda-*.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $failed = 0

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "--- attempt $attempt of 3 ---"
            $log = "events-$attempt.jsonl"
            # stdout only: that is where the JSON events go. stderr carries the
            # crash message and stays on the console, where it is wanted, and
            # out of the file, where it would corrupt parsing.
            & $exe.FullName -Zunstable-options --format=json --test-threads=${{ matrix.threads }} > $log
            $code = $LASTEXITCODE

            # `.github/scripts/inflight_tests.py` does the parsing. It lives in
            # a file, not inline here, so it can be run against real logs
            # locally: it has been checked against a clean run, a run killed
            # mid-flight, and a log whose final line was cut in half.
            python .github/scripts/inflight_tests.py $log
            if ($code -eq 0) { continue }

            Write-Host "==== last 15 events ===="
            Get-Content $log -Tail 15 | ForEach-Object { Write-Host "  $_" }
            Write-Host "::error::attempt $attempt died with exit $code"
            $failed = 1
            break
          }
          # The crash is the finding, so report it as a failed cell.
          exit $failed
