name: test

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'shaders/**'
      - 'kittest.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/test.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 
  # Exclude the egui golden-image tests. 
  VARDA_SKIP_GOLDEN_SNAPSHOTS: 1

jobs:
  test-linux:
    name: test (linux)
    # Scoped to this job on purpose.
    env:
      VARDA_REQUIRE_GPU: 1
    # ubuntu-24.04 (glibc 2.39) required: ort's prebuilt ONNX Runtime
    # references __isoc23_strtol / __isoc23_strtoull / __isoc23_strtoll
    # which only exist in glibc >= 2.38. ubuntu-22.04 (glibc 2.35) fails.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          # libfreenect-dev lives in the `universe` component — enable it so the
          # default-on `depth` feature's -lfreenect resolves (see
          # spec/depth-sensors.md).
          # libpipewire-0.3-dev backs the default-on `screen-capture` feature:
          # libspa-sys resolves libpipewire-0.3 through pkg-config at build time,
          # so its absence fails the build outright. See spec/screen-capture.md.
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libvulkan-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavdevice-dev \
            libsrt-gnutls-dev \
            libasound2-dev \
            libv4l-dev \
            libfreenect-dev \
            libpipewire-0.3-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev libxi-dev \
            libgtk-3-dev
          # Fail loudly here (not at the opaque linker error) if the dev symlink
          # the linker needs for -lfreenect is missing.
          test -e /usr/lib/x86_64-linux-gnu/libfreenect.so \
            || { echo "::error::libfreenect-dev did not provide libfreenect.so"; exit 1; }

      - name: Install lavapipe (software Vulkan)
        run: |
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          # The ICD filename is not stable across Mesa packaging: noble ships
          # 24.0 as lvp_icd.x86_64.json, noble-updates ships 25.2 as plain
          # lvp_icd.json. Glob for it and pin whatever is actually installed —
          # mesa-vulkan-drivers also ships radeon/intel/virtio/nouveau ICDs, and
          # naming lavapipe explicitly keeps the rasterizer identical across
          # runner types.
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          if [ ! -e "${icds[0]}" ]; then
            echo "::error::mesa-vulkan-drivers did not provide a lavapipe ICD"
            ls -la /usr/share/vulkan/icd.d/
            exit 1
          fi
          echo "Using lavapipe ICD: ${icds[0]}"
          echo "VK_DRIVER_FILES=${icds[0]}" >> "$GITHUB_ENV"

      # Prove the adapter is real before building the suite, and print the
      # summary so a driver/version change is visible in the log.
      - name: Verify lavapipe adapter
        run: |
          vulkaninfo --summary | tee /tmp/vulkaninfo.txt
          grep -qi llvmpipe /tmp/vulkaninfo.txt \
            || { echo "::error::lavapipe did not enumerate as a Vulkan device"; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run test suite
        run: cargo test --workspace

  test-windows:
    name: test (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # The runner has 16 GB and a small paging file. The first attempt died in
      # rustc, not the linker, mmapping dependency rlibs:
      # `os error 1455: The paging file is too small for this operation`,
      # surfacing as `E0786: found invalid metadata files`.
      #
      # Debug info is the bulk of those rlibs: measured locally, one `libvarda`
      # rlib is ~425 MB at `debuginfo=2`. Dropping it shrinks every artefact
      # rustc has to map, and a backtrace from a CI failure is worth less than
      # the assertion message anyway.
      CARGO_PROFILE_TEST_DEBUG: "0"
      # And halve how many of those rustc processes hold memory at once. Slower,
      # but the job is bounded by linking rather than by CPU.
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-x64-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: vcpkg-windows-x64-

      - name: Install vcpkg FFmpeg
        shell: pwsh
        run: |
          vcpkg install ffmpeg:x64-windows
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Install LLVM (for shaderc)
        run: choco install llvm -y
        shell: cmd

      - name: Set build environment
        shell: pwsh
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Its own step so the report reaches the log even when the suite below
      # fails, and so a Spout regression is named rather than buried among two
      # thousand other tests. The runner's adapter is Microsoft Basic Render
      # Driver (WARP) and the whole D3D11On12 bridge works on it, which is why
      # this now asserts rather than reports. See spec/spout-output.md.
      - name: Spout capability
        run: cargo test --no-default-features --features face-detection,screen-capture --lib spout::capability -- --nocapture

      # Enabled now that the step above has confirmed wgpu finds a Dx12 adapter
      # here. Without it a runner that lost its adapter would skip every GPU test
      # and still report green, which is the failure mode the Linux job's own
      # comment warns about.
      # `html` is deliberately absent, unlike `clippy (windows)` and the release
      # build. Servo's `libscript` alone is ~486 MB per debug rlib and dominates
      # both the build time and the memory that broke this job. Nothing is lost:
      # clippy (windows) still type-checks the feature and the release job still
      # builds it, and the HtmlManager surface compiles without it, so the
      # integration and persistence tests around HTML decks still run here.
      # `--test-threads=1` is a diagnostic, not a preference. The first run of
      # this suite died with STATUS_HEAP_CORRUPTION (0xc0000374) part way through,
      # and under the default parallelism the last test *printed* is not the test
      # that crashed, so the log named nothing. Serial execution makes the last
      # line the culprit. Restore parallelism once the cause is identified: this
      # suite is 2586 tests and serial is much slower.
      #
      # This is the first time Varda's tests have ever run on Windows, so a
      # long-standing Windows-only fault is as likely as a new one.
      - name: Run test suite
        env:
          VARDA_REQUIRE_GPU: 1
        run: cargo test --no-default-features --features face-detection,screen-capture -- --test-threads=1
