name: Build artifacts

# Every release artifact, built and then actually run on a clean machine of its own
# platform. Called by release.yml on a tag, and by release-dryrun.yml on a pull request,
# so what goes green in a PR is the release pipeline itself rather than a copy of it that
# can drift away from it.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to stamp into the artifacts (no leading v)'
        type: string
        required: true
      source-ref:
        description: >-
          Git ref whose source archive the Arch PKGBUILD fetches and checksums. A tag for
          a real release; a commit SHA for a dry run, where the tag does not exist yet.
        type: string
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    # Built once, on the oldest glibc we support. An AppImage runs on a host whose glibc is
    # at least as new as its build machine, and 24.04 is the floor ort's prebuilt ONNX
    # Runtime already imposes, so this costs nothing that was not already lost.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install NDI SDK
        run: |
          cd /tmp
          curl -sL https://downloads.ndi.tv/SDK/NDI_SDK_Linux/Install_NDI_SDK_v6_Linux.tar.gz | tar xz
          echo Y | ./Install_NDI_SDK_v6_Linux.sh >/dev/null

      - name: Build AppImage
        run: ./scripts/ci/build-linux-appimage.sh --version '${{ inputs.version }}' --outdir dist

      - uses: actions/upload-artifact@v5
        with:
          name: linux-appimage
          path: dist/*.AppImage

  smoke-appimage:
    name: AppImage smoke ${{ matrix.name }}
    needs: [appimage]
    runs-on: ubuntu-latest
    # Every distribution here is a genuinely different test: an AppImage links the host's
    # glibc, GL, X11 and audio stack. Contrast the Flatpak, whose runtime is identical
    # everywhere. See spec/release-strategy.md section 12.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Debian 13',    image: 'debian:13' }
          - { name: 'Ubuntu 24.04', image: 'ubuntu:24.04' }
          - { name: 'Ubuntu 26.04', image: 'ubuntu:26.04' }
          - { name: 'Fedora 44',    image: 'fedora:44' }
          - { name: 'openSUSE',     image: 'opensuse/leap:16.0' }
          - { name: 'Arch',         image: 'archlinux:latest' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: linux-appimage
          path: dist

      - name: Run on ${{ matrix.name }}
        run: |
          PKG="$(ls dist/*.AppImage | head -1)"
          docker run --rm -v "$PWD:/work" -w /work "${{ matrix.image }}" \
            bash -c "./scripts/ci/smoke-linux-appimage.sh '$PKG'"

  flatpak:
    name: Linux Flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build Flatpak
        run: ./scripts/ci/build-linux-flatpak.sh --version '${{ inputs.version }}' --outdir dist
      - uses: actions/upload-artifact@v5
        with:
          name: linux-flatpak
          path: dist/*.flatpak

  smoke-flatpak:
    name: Flatpak smoke ${{ matrix.name }}
    needs: [flatpak]
    runs-on: ubuntu-latest
    # One row per packaging family, not all six. The Flatpak runtime is identical on every
    # host by construction, so additional rows re-test the host's own flatpak installation
    # rather than our artifact. See spec/release-strategy.md section 12.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Debian 13 (deb)', image: 'debian:13' }
          - { name: 'Fedora 44 (rpm)', image: 'fedora:44' }
          - { name: 'Arch',            image: 'archlinux:latest' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: linux-flatpak
          path: dist

      - name: Install and run on ${{ matrix.name }}
        run: |
          PKG="$(ls dist/*.flatpak | head -1)"
          docker run --rm --privileged -v "$PWD:/work" -w /work "${{ matrix.image }}" \
            bash -c "./scripts/ci/smoke-linux-flatpak.sh '$PKG'"

  build-macos-arm64:
    name: macOS arm64 (.app)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          brew tap homebrew-ffmpeg/ffmpeg
          brew install homebrew-ffmpeg/ffmpeg/ffmpeg --with-srt
          brew install cmake pkg-config create-dmg nasm
          brew install --cask libndi
          brew install libfreenect

      - name: Build .app
        run: |
          ./scripts/ci/build-macos.sh --native-only --skip-deps --tag "${{ inputs.version }}"

      # upload-artifact does not preserve symlinks or the executable bit, both of which
      # a .app bundle depends on. Tar it and let the combine job untar.
      - name: Pack
        run: tar czf arm64-app.tar.gz Varda.app

      - uses: actions/upload-artifact@v5
        with:
          name: macos-app-arm64
          path: arm64-app.tar.gz
          retention-days: 1

  build-macos-intel:
    name: macOS x86_64 (.app)
    # Built natively on Intel hardware rather than cross-compiled. macos-15-intel is
    # available until August 2027, after which GitHub has no x86_64 macOS image and this
    # job has to become a cross-compile again (or the slice gets dropped).
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Homebrew on an Intel runner installs x86_64 binaries, so the same recipe as the
      # arm64 job produces the right architecture. No cross-compiled FFmpeg needed.
      - name: Install dependencies
        run: |
          brew tap homebrew-ffmpeg/ffmpeg
          brew install homebrew-ffmpeg/ffmpeg/ffmpeg --with-srt
          brew install cmake pkg-config create-dmg nasm
          brew install --cask libndi
          brew install libfreenect

      # Feature set comes from cargo_features_for() in build-macos.sh: face-detection
      # and html are off on x86_64 for reasons recorded there; depth and screen-capture
      # are on, which a cross-compiled slice could not manage.
      - name: Build .app
        run: |
          ./scripts/ci/build-macos.sh --native-only --skip-deps --tag "${{ inputs.version }}"

      - name: Pack
        run: tar czf x86-app.tar.gz Varda.app

      - uses: actions/upload-artifact@v5
        with:
          name: macos-app-x86_64
          path: x86-app.tar.gz
          retention-days: 1

  build-macos:
    name: macOS Universal DMG
    needs: [build-macos-arm64, build-macos-intel]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install create-dmg
        run: brew install create-dmg

      - uses: actions/download-artifact@v5
        with:
          name: macos-app-arm64
      - uses: actions/download-artifact@v5
        with:
          name: macos-app-x86_64

      # Each tarball holds Varda.app at its root, so extract and rename.
      - name: Unpack both slices
        run: |
          tar xzf arm64-app.tar.gz && mv Varda.app arm64-app
          tar xzf x86-app.tar.gz   && mv Varda.app x86-app
          echo "arm64 slice: $(lipo -archs arm64-app/Contents/MacOS/varda)"
          echo "x86   slice: $(lipo -archs x86-app/Contents/MacOS/varda)"
          # Fail here rather than shipping a DMG whose "universal" binary is one arch
          # lipoed with itself.
          lipo -archs arm64-app/Contents/MacOS/varda | grep -q arm64
          lipo -archs x86-app/Contents/MacOS/varda   | grep -q x86_64

      - name: Create universal DMG
        run: ./scripts/ci/combine-universal.sh arm64-app x86-app

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: macos-dmg
          path: Varda-macOS-universal.dmg

  build-windows:
    name: Windows x64 (portable ZIP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install vcpkg FFmpeg
        shell: pwsh
        run: |
          vcpkg install ffmpeg:x64-windows
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-x64-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: vcpkg-windows-x64-

      - name: Install LLVM (for shaderc)
        run: choco install llvm -y
        shell: cmd

      - name: Set LLVM environment
        shell: pwsh
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> $env:GITHUB_ENV

      - name: Install NDI Runtime
        shell: pwsh
        run: |
          $ndiUrl = "https://downloads.ndi.tv/SDK/NDI_SDK/NDI%206%20Runtime.exe"
          $ndiInstaller = "$env:TEMP\ndi-runtime.exe"
          Invoke-WebRequest -Uri $ndiUrl -OutFile $ndiInstaller
          Start-Process -FilePath $ndiInstaller -ArgumentList "/verysilent" -Wait
          Write-Host "NDI Runtime installed"

      - name: Set FFmpeg pkg-config path
        shell: pwsh
        run: |
          echo "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: Build release binary
        shell: pwsh
        # The `depth` feature (Kinect v1 via libfreenect) is excluded on Windows
        run: cargo build --release --no-default-features --features face-detection,html,screen-capture

      - name: Package portable ZIP
        shell: pwsh
        run: .\scripts\ci\build-windows.ps1 -SkipBuild

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-zip
          path: Varda-Windows-x64.zip

  smoke-macos:
    name: macOS smoke (${{ matrix.name }})
    needs: [build-macos]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both slices get executed. The x86_64 half of the universal binary is
          # cross-compiled on an arm64 runner and is otherwise never run anywhere in CI,
          # so a broken Intel slice would ship silently.
          - { name: 'Apple Silicon', runner: 'macos-15' }
          # macos-13 was fully retired in December 2025. macos-15-intel is the supported
          # Intel label and is available until August 2027, after which GitHub has no
          # x86_64 macOS image at all.
          - { name: 'Intel', runner: 'macos-15-intel' }
    steps:
      - uses: actions/checkout@v5

      - name: Download DMG
        uses: actions/download-artifact@v5
        with:
          name: macos-dmg

      - name: Mount, inspect and run
        run: ./scripts/ci/smoke-macos-dmg.sh Varda-macOS-universal.dmg

  smoke-windows:
    name: Windows smoke
    needs: [build-windows]
    # A clean runner, deliberately not the one that built it: the build runner has vcpkg,
    # the NDI Runtime and LLVM installed, so a DLL missing from the ZIP would resolve
    # there and fail only for users.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download ZIP
        uses: actions/download-artifact@v5
        with:
          name: windows-zip

      - name: Extract and run
        shell: pwsh
        run: .\scripts\ci\smoke-windows-zip.ps1 -Zip Varda-Windows-x64.zip

