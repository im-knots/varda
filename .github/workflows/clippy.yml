name: clippy

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/clippy.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  clippy-linux:
    name: clippy (linux)
    # ubuntu-24.04 (glibc 2.39) required: ort's prebuilt ONNX Runtime
    # references __isoc23_strtol / __isoc23_strtoull / __isoc23_strtoll
    # which only exist in glibc >= 2.38. ubuntu-22.04 (glibc 2.35) fails.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          # libfreenect-dev lives in the `universe` component — enable it so the
          # default-on `depth` feature's -lfreenect resolves for --all-targets
          # (test/bench binaries link) — see spec/depth-sensors.md.
          # libpipewire-0.3-dev backs the default-on `screen-capture` feature:
          # libspa-sys resolves libpipewire-0.3 through pkg-config at build time,
          # so its absence fails the build outright. See spec/screen-capture.md.
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libvulkan-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavdevice-dev \
            libsrt-gnutls-dev \
            libasound2-dev \
            libv4l-dev \
            libfreenect-dev \
            libpipewire-0.3-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev libxi-dev \
            libgtk-3-dev
          # Fail loudly here (not at the opaque linker error) if the dev symlink
          # the linker needs for -lfreenect is missing.
          test -e /usr/lib/x86_64-linux-gnu/libfreenect.so \
            || { echo "::error::libfreenect-dev did not provide libfreenect.so"; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run clippy (pedantic)
        run: cargo clippy --all-targets -- -D warnings

  clippy-macos:
    name: clippy (macos)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew tap homebrew-ffmpeg/ffmpeg
          brew install homebrew-ffmpeg/ffmpeg/ffmpeg --with-srt
          brew install cmake pkg-config nasm
          # libfreenect backs the default-on `depth` feature — see spec/depth-sensors.md.
          brew install libfreenect

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Homebrew's arm64 prefix is not on the default linker search path, and
      # `--all-targets` links test/bench binaries. See AGENTS.md.
      - name: Run clippy (pedantic)
        run: cargo clippy --all-targets -- -D warnings
        env:
          LIBRARY_PATH: /opt/homebrew/lib

  clippy-windows:
    name: clippy (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-x64-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: vcpkg-windows-x64-

      # `ffmpeg-next` and `shaderc` are unconditional dependencies
      - name: Install vcpkg FFmpeg
        shell: pwsh
        run: |
          vcpkg install ffmpeg:x64-windows
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Install LLVM (for shaderc)
        run: choco install llvm -y
        shell: cmd

      - name: Set build environment
        shell: pwsh
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run clippy (pedantic)
        run: cargo clippy --all-targets --no-default-features --features face-detection,html,screen-capture -- -D warnings
