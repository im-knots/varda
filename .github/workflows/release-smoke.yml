name: Release artifact smoke

# Installs every published release artifact on a clean machine of its own platform,
# weekly.
#
# Separate from the release gate on purpose (spec/release-strategy.md section 12). A
# release gate catches regressions we introduce. It cannot catch the ground moving under
# an artifact that already shipped, which is what happened in issue #134: Arch changed
# libxml2's SONAME months after v0.6.0 was built, and the first we heard was a bug report.
#
# This matters most to the AppImage, which links the host's glibc, GL, X11 and audio
# stack: every distribution is a genuinely different test, and the ground can move under
# any of them. The Flatpak runs against a runtime that is identical everywhere, so one
# row per packaging family is enough; what can still rot there is the runtime version
# itself disappearing from Flathub.
on:
  schedule:
    # Mondays 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test (default: latest)'
        required: false

jobs:
  linux-appimage:
    name: AppImage ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Debian 13',    image: 'debian:13' }
          - { name: 'Ubuntu 24.04', image: 'ubuntu:24.04' }
          - { name: 'Ubuntu 26.04', image: 'ubuntu:26.04' }
          - { name: 'Fedora 44',    image: 'fedora:44' }
          - { name: 'openSUSE',     image: 'opensuse/leap:16.0' }
          - { name: 'Arch',         image: 'archlinux:latest' }
    steps:
      - uses: actions/checkout@v5

      - name: Download the published AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          TAG="${{ github.event.inputs.tag }}"
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --pattern '*.AppImage' --dir dist
          else
            gh release download --pattern '*.AppImage' --dir dist
          fi
          ls -lh dist/

      - name: Run on ${{ matrix.name }}
        run: |
          PKG="$(ls dist/*.AppImage | head -1)"
          docker run --rm -v "$PWD:/work" -w /work "${{ matrix.image }}" \
            bash -c "./scripts/ci/smoke-linux-appimage.sh '$PKG'"

  linux-flatpak:
    name: Flatpak ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Debian 13 (deb)', image: 'debian:13' }
          - { name: 'Fedora 44 (rpm)', image: 'fedora:44' }
          - { name: 'Arch',            image: 'archlinux:latest' }
    steps:
      - uses: actions/checkout@v5

      - name: Download the published bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          TAG="${{ github.event.inputs.tag }}"
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --pattern '*.flatpak' --dir dist
          else
            gh release download --pattern '*.flatpak' --dir dist
          fi
          ls -lh dist/

      # --privileged: flatpak run needs bubblewrap, which cannot create user namespaces
      # in a default container.
      - name: Install and run on ${{ matrix.name }}
        run: |
          PKG="$(ls dist/*.flatpak | head -1)"
          docker run --rm --privileged -v "$PWD:/work" -w /work "${{ matrix.image }}" \
            bash -c "./scripts/ci/smoke-linux-flatpak.sh '$PKG'"

  macos:
    name: macOS ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Apple Silicon', runner: 'macos-15' }
          - { name: 'Intel', runner: 'macos-15-intel' }
    steps:
      - uses: actions/checkout@v5
      - name: Download published DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --pattern 'Varda-macOS-universal.dmg'
          else
            gh release download --pattern 'Varda-macOS-universal.dmg'
          fi
      - name: Mount, inspect and run
        run: ./scripts/ci/smoke-macos-dmg.sh Varda-macOS-universal.dmg

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download published ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --pattern 'Varda-Windows-x64.zip'
          else
            gh release download --pattern 'Varda-Windows-x64.zip'
          fi
      - name: Extract and run
        shell: pwsh
        run: .\scripts\ci\smoke-windows-zip.ps1 -Zip Varda-Windows-x64.zip
